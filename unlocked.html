<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Unlocking&hellip;</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000}
  .wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div class="wrap">
  <video id="v" src="assets/stage-media.mp4" autoplay playsinline></video>
</div>
<script>
// If autoplay-with-sound gets blocked, any tap/click on the page retries it.
const v = document.getElementById('v');
v.play().catch(() => {
  document.addEventListener('click', () => v.play(), { once: true });
});
</script>
</body>
</html>
