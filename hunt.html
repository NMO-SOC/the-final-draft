<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Last Draft</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=21">
</head>
<body>
<main id="app">
  <div class="masthead">
    <h1 id="teamname">&hellip;</h1>
    <p class="sub">The Last Draft</p>
  </div>
  <div id="stage"></div>
  <div id="board" class="board" hidden>
    <h2>Standings</h2>
    <div id="board-list"></div>
  </div>
  <div id="chat" class="chat">
    <button id="chat-toggle" class="quiet">Message your teacher</button>
    <div id="chat-panel" hidden>
      <div id="chat-log" class="chat-log"></div>
      <form id="chat-form" class="row">
        <input id="chat-input" type="text" autocomplete="off" placeholder="Type a message&hellip;">
        <button type="submit">Send</button>
      </form>
    </div>
  </div>
</main>
<script type="module" src="assets/hunt.js?v=20"></script>
</body>
</html>
