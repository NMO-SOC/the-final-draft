<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>The Last Draft — control</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/styles.css?v=20">
</head>
<body>
<main class="wide">
  <div class="masthead">
    <h1>Hunt control</h1>
    <p class="sub">The Last Draft</p>
  </div>

  <form id="login">
    <label for="em">Email</label>
    <input id="em" type="text" autocomplete="username" required>
    <label for="pw" style="margin-top:1rem">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <div class="row"><button type="submit">Sign in</button></div>
    <div id="loginmsg"></div>
  </form>

  <div id="panel" hidden>
    <div class="tabs">
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="content">Edit stages</button>
    </div>

    <div id="tab-dashboard">
      <div class="row" id="controls"></div>
      <div id="hunt-settings"></div>

      <form id="broadcast-form" class="row" style="margin-top:1.5rem">
        <label for="broadcast-input" style="margin:0;align-self:center">Announce to all</label>
        <input id="broadcast-input" type="text" autocomplete="off"
               placeholder="Goes to every team at once&hellip;" style="flex:1;min-width:14rem">
        <button type="submit">Send to all</button>
        <span id="broadcast-msg" class="aside"></span>
      </form>

      <div class="cols">
        <div>
          <h2>Teams</h2>
          <div class="table-scroll">
          <table class="teams"><thead><tr>
            <th>Team</th><th>Stage</th><th>On stage</th><th>Wrong</th>
            <th>Flags</th><th>Penalty</th><th>Actions</th>
          </tr></thead><tbody id="teams"></tbody></table>
          </div>
          <h2>Hint requests</h2>
          <div id="hints"></div>
          <h2>Completions to review</h2>
          <div id="completions"></div>
        </div>
        <div>
          <h2>Activity</h2>
          <div class="log" id="log"></div>
          <h2>Messages</h2>
          <div class="row" style="align-items:center;gap:1rem">
            <label for="chat-team-pick" style="margin:0">Team</label>
            <select id="chat-team-pick" style="width:auto"></select>
          </div>
          <div id="chat-log" class="chat-log" style="margin-top:.75rem"></div>
          <form id="chat-form" class="row">
            <input id="chat-input" type="text" autocomplete="off" placeholder="Reply&hellip;">
            <button type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>

    <div id="tab-content" hidden>
      <p class="aside">Changes take effect immediately. Every team sees the updated text on their next page load.</p>
      <div class="row" style="margin-bottom:1.5rem;align-items:center;gap:1rem">
        <label for="stage-pick" style="margin:0">Stage</label>
        <select id="stage-pick" style="width:auto"></select>
      </div>
      <div id="stage-editor"></div>
    </div>
  </div>
</main>
<script type="module" src="assets/teacher.js?v=18"></script>
</body>
</html>
